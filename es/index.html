<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbor: tu curadora de fotos para iPhone, iPad y Mac</title>
<meta name="description" content="Arbor ordena tus fotos en iPhone, iPad y Mac, capturas incluidas. Lee cada una, le pone un nombre que reconocerás y la archiva donde la volverás a encontrar.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151614" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Arbor: tu curadora de fotos">
<meta property="og:description" content="Agrega tus fotos. Arbor las ordena, les pone nombre y las archiva. Para iPhone, iPad y Mac.">
<meta property="og:image" content="https://arborcurator.com/img/share.png">
<meta property="og:url" content="https://arborcurator.com/es/">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="alternate" hreflang="en" href="https://arborcurator.com/">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: Arbor's home page itself, full width. Motion lives in the page (a drifting color wash, a moving strip of
   pictures, tabs that switch by themselves, sliding feature cards, a name that types itself, scroll reveals).
   Apple's device frames stay still and straight, as Apple's marketing rules require. A small pill tries colors, fonts, dark. */
:root {
  --bg:#ffffff; --fg:#1d1c1a; --muted:#66625b; --line:#dedbd5; --green:#31573D; --gold:#B57A26; --on:#ffffff;
  --apple:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141513; --fg:#ecebe7; --muted:#a39e96; --line:#34352f; --green:#8fc59f; --gold:#e0ad5e; --on:#141513; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#141513; --fg:#ecebe7; --muted:#a39e96; --line:#34352f; --green:#8fc59f; --gold:#e0ad5e; --on:#141513; color-scheme:dark }
body { background:var(--bg); color:var(--fg); margin:0; }
button:focus-visible, a:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
.pill { position:fixed; right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:20; display:flex; flex-wrap:wrap; gap:8px; padding:8px; border-radius:14px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,.12); max-width:calc(100vw - 32px); font-family:var(--apple); }
.seg { display:flex; flex-wrap:wrap; gap:4px; }
.seg button { font:inherit; font-size:.8rem; padding:4px 9px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--green); border-color:var(--green); color:var(--on); }

/* ===== The website ===== */
.site { --s-bg:#ffffff; --s-fg:#1d1c1a; --s-muted:#5f5b55; --s-line:#e6e3dd; --s-head:#1d1c1a; --s-mark:#31573D; --s-gold:#D1953E;
  --s-btn:#D1953E; --s-btntext:#1d1c1a; --s-panel:#f6f4ef; --s-panel2:#eef3ec; --s-wash1:#e9f1e7; --s-wash2:#fbefdc; --s-card:#ffffff;
  --s-hfont:"Source Serif 4", Georgia, serif; --s-bfont:"Source Serif 4", Georgia, serif;
  background:var(--s-bg); color:var(--s-fg); font-family:var(--s-bfont); font-size:17px; line-height:1.6; overflow-x:clip; container-type:inline-size; }
.site.c-a { --s-head:#31573D; --s-btn:#31573D; --s-btntext:#fff; }
.site.c-b { --s-bg:#EEF3EC; --s-head:#31573D; --s-btn:#31573D; --s-btntext:#fff; --s-panel:#ffffff; --s-panel2:#ffffff; --s-card:#ffffff; --s-line:#d6e0d3; --s-wash1:#dbe9d6; --s-wash2:#f7ecd8; --s-muted:#4d5a50; }
.site.c-b.dark { --s-bg:#121a14; --s-panel:#1c271f; --s-panel2:#1c271f; --s-card:#1c271f; --s-line:#2c3a2f; --s-wash1:#1d3123; --s-wash2:#2a2418; }
.site.dark { --s-bg:#151614; --s-fg:#ecebe7; --s-muted:#a7a29a; --s-line:#33342f; --s-head:#f1efe9; --s-mark:#a9d3b5; --s-gold:#e0ad5e; --s-btn:#e0ad5e; --s-btntext:#151614; --s-panel:#1e201c; --s-panel2:#1a221c; --s-wash1:#1b2a1f; --s-wash2:#2a2216; --s-card:#1e201c; }
.site.c-a.dark, .site.c-b.dark { --s-head:#a9d3b5; --s-btn:#8fc59f; --s-btntext:#10170f; }
.site.f-a { --s-bfont:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
.site.f-c { --s-bfont:"Source Sans 3", "Helvetica Neue", Arial, sans-serif; }
.site h1, .site h2, .site h3 { font-family:var(--s-hfont); font-weight:600; color:var(--s-head); margin:0; text-wrap:balance; }
.site p { margin:0; }
.in { max-width:1160px; margin:0 auto; padding-left:max(40px, env(safe-area-inset-left, 0px)); padding-right:max(40px, env(safe-area-inset-right, 0px)); }
.nav { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:18px; position:relative; z-index:2; }
.brand { display:flex; align-items:center; text-decoration:none; } .lockup { height:40px; width:auto; display:block; } .lg { fill:#31573D; } .lo { fill:#D1953E; } .site.dark .lg { fill:#a9d3b5; } .site.dark .lo { fill:#e0ad5e; }
.links { display:flex; gap:24px; font-size:.95rem; align-items:center; }
.links a { color:var(--s-muted); text-decoration:none; } .links a:hover { color:var(--s-fg); }
.links .lang { border:1px solid var(--s-line); border-radius:8px; padding:3px 10px; }

/* Hero with a slowly drifting color wash (PDF Expert style) */
.top { position:relative; isolation:isolate; }
.wash { position:absolute; inset:0 0 18% 0; z-index:-1; overflow:hidden; }
.wash i { position:absolute; width:62vmax; height:62vmax; border-radius:50%; filter:blur(70px); opacity:.9; }
.wash i:nth-child(1) { background:var(--s-wash1); left:-12%; top:-30%; }
.wash i:nth-child(2) { background:var(--s-wash2); right:-14%; top:-24%; }
.wash i:nth-child(3) { background:var(--s-wash1); left:30%; top:20%; width:44vmax; height:44vmax; opacity:.6; }
.wash::after { content:""; position:absolute; inset:auto 0 0 0; height:40%; background:linear-gradient(transparent, var(--s-bg)); }
.hero { text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; padding-block:46px 10px; }
.for { font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--s-mark); }
.h1 { font-size:3.6rem; line-height:1.05; letter-spacing:-.012em; max-width:16ch; }
.h1 span { display:inline-block; }
.sub { font-size:1.2rem; color:var(--s-muted); max-width:46ch; text-wrap:balance; }
.btns { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:6px; }
.btn { font:inherit; font-size:1rem; font-weight:600; border-radius:10px; padding:12px 22px; border:1px solid var(--s-btn); background:var(--s-btn); color:var(--s-btntext); text-decoration:none; cursor:pointer; }
.btn.ghost { background:transparent; color:var(--s-fg); border-color:var(--s-line); font-weight:400; }
.small { font-size:.86rem; color:var(--s-muted); }

/* Apple's own device frames, straight on, side by side, true relative size, never moved or overlapped */
.devices { display:flex; align-items:flex-end; justify-content:center; gap:2.2%; max-width:1080px; margin:40px auto 0; padding-inline:24px; }
.dev { position:relative; flex:none; }
.dev .frame { position:relative; z-index:2; display:block; width:100%; height:auto; pointer-events:none; }
.dev .screen { position:absolute; z-index:1; overflow:hidden; background:#fff; }
.dev.iphone .screen { border-radius:13% / 6%; } .dev.ipad .screen { border-radius:4% / 3%; } .dev.ipadl .screen { border-radius:3% / 4%; } .dev.duo .screen { border-radius:5% / 3.5%; } .dev.mac .screen { border-radius:1.5% 1.5% 0 0 / 2.3% 2.3% 0 0; }
.devices .dev.mac { width:50%; } .devices .dev.ipadl { width:36.5%; } .dev.mac .screen { left:9.294%; top:9.478%; width:81.356%; height:81.043%; }
.devices .dev.ipad { width:29.5%; } .dev.ipad .screen { left:9.804%; top:7.246%; width:80.343%; height:85.507%; }
.devices .dev.iphone { width:10.6%; } .dev.iphone .screen { left:5.333%; top:2.5%; width:89.333%; height:95%; }
.dev.ipadl .screen { left:7.246%; top:9.804%; width:85.507%; height:80.392%; }
.dev.mini .screen { left:5.077%; top:7.494%; width:89.846%; height:85.011%; border-radius:3% / 4.5%; }
.dev.minip .screen { left:7.494%; top:5.077%; width:85.011%; height:89.846%; border-radius:4.5% / 3%; }
.dev.neo .screen { left:12.647%; top:14.26%; width:74.706%; height:71.48%; }
.dev.pro .screen { left:10.882%; top:11.449%; width:78.235%; height:77.102%; }
.dev.imac .screen { left:2.962%; top:3.752%; width:94.077%; height:62.116%; }
.dev.duo .screen { left:5.340%; top:3.880%; width:89.319%; height:92.240%; }
.screen img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; background:#fff; }
.screen .slide { position:absolute; inset:0; opacity:0; transition:opacity .9s ease; }
.screen .slide.on { opacity:1; }
.coming { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; padding:8%; font-family:var(--apple); font-size:.78rem; line-height:1.35; color:#77736c; background:#f4f3ef; }
.coming br { display:none; } .coming i { font-size:.85em; opacity:.75; }
.standin { position:absolute; left:8px; bottom:8px; z-index:3; font-family:var(--apple); font-size:.66rem; background:rgba(29,28,26,.82); color:#fff; border-radius:5px; padding:2px 7px; }

.devcaps { display:flex; justify-content:center; gap:2.2%; max-width:1080px; margin:18px auto 0; padding-inline:24px; text-align:center; }
.devcaps > div { flex:none; display:flex; flex-direction:column; gap:2px; }
.devcaps .cap-ipad { width:36.5%; } .devcaps .cap-mac { width:50%; } .devcaps .cap-iphone { width:10.6%; }
.devcaps b { font-family:var(--s-hfont); font-size:1.25rem; font-weight:600; color:var(--s-fg); }
.devcaps span { color:var(--s-muted); font-size:.92rem; }
.syncline { text-align:center; color:var(--s-muted); font-size:.95rem; margin:14px auto 0 !important; max-width:60ch; padding-inline:20px; }
/* Proof line */
.proof { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 36px; padding-block:34px 0; color:var(--s-muted); }
.proof span { display:flex; align-items:center; gap:8px; } .proof i { width:6px; height:6px; border-radius:50%; background:var(--s-gold); display:block; }

/* Moving strip of real pictures */
.strip { margin-top:64px; overflow:hidden; mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.strip-cap { text-align:center; color:var(--s-muted); font-size:.95rem; margin-bottom:16px; }
.track { display:flex; gap:16px; width:max-content; }
.track figure { margin:0; height:190px; border-radius:12px; overflow:hidden; flex:none; box-shadow:0 8px 24px -12px rgba(0,0,0,.25); }
.track img { height:100%; width:auto; display:block; }
.track.two { margin-top:16px; }

.sec { padding-block:96px; }
.sec-head { text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center; margin-bottom:36px; }
.sec-head h2 { font-size:2.6rem; line-height:1.1; max-width:20ch; }
.sec-head p { color:var(--s-muted); font-size:1.15rem; max-width:50ch; }

/* How it works, with a name that types itself */
.how { list-style:none; margin:0 auto; padding:0; display:grid; grid-template-columns:repeat(5, 1fr); gap:22px; }
.how li { display:flex; flex-direction:column; gap:8px; border-top:2px solid var(--s-line); padding-top:16px; position:relative; }
.how li::before { content:""; position:absolute; left:0; top:-2px; height:2px; width:0; background:var(--s-gold); transition:width 1.2s ease; }
.how li.on::before { width:100%; }
.how .n { font-family:var(--s-hfont); font-size:1.5rem; font-weight:600; color:var(--s-gold); line-height:1; }
.how b { font-family:var(--s-hfont); font-size:1.2rem; font-weight:600; color:var(--s-fg); }
.how p { color:var(--s-muted); font-size:.98rem; }
.rename { margin:42px auto 0; max-width:680px; display:flex; align-items:center; gap:22px; background:var(--s-card); border:1px solid var(--s-line); border-radius:18px; padding:16px; box-shadow:0 14px 34px -18px rgba(0,0,0,.25); }
.rename img { width:110px; height:110px; object-fit:cover; border-radius:12px; flex:none; }
.rename .names { position:relative; flex:1; min-width:0; }
.rename .old { position:relative; display:inline-block; font-family:var(--apple); font-size:1.35rem; color:var(--s-fg); transition:opacity .45s ease, transform .45s ease, filter .45s ease; }
.rename .old svg { position:absolute; left:-6%; top:50%; width:112%; height:1.9em; transform:translateY(-50%); overflow:visible; pointer-events:none; }
.rename .old path { fill:none; stroke:var(--s-fg); stroke-opacity:.82; stroke-width:4.2; stroke-linecap:round; stroke-linejoin:round; }
.rename.gone .old { opacity:0; transform:scale(.9) translateY(-4px); filter:blur(3px); }
.rename .new { position:relative; display:inline-block; font-family:var(--s-hfont); font-size:1.7rem; font-weight:600; color:var(--s-head); line-height:1.25; margin-top:4px; clip-path:inset(0 100% 0 0); }
.rename.write .new { animation:write 1.3s cubic-bezier(.45,.05,.4,1) forwards; }
@keyframes write { to { clip-path:inset(0 0 0 0); } }
.rename .new svg { position:absolute; left:0; bottom:-.32em; width:100%; height:.5em; overflow:visible; }
.rename .new svg path { fill:none; stroke:var(--s-gold); stroke-width:3; stroke-linecap:round; stroke-dasharray:240; stroke-dashoffset:240; }
.rename.write .new svg path { animation:under .6s 1.25s ease-out forwards; }
@keyframes under { to { stroke-dashoffset:0; } }
.rename .chip { display:inline-flex; gap:6px; margin-top:10px; font-family:var(--apple); font-size:.88rem; padding:5px 12px; border-radius:999px; background:var(--s-panel2); color:var(--s-mark); opacity:0; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease; }
.rename .chip.on { opacity:1; transform:none; }
.rename .tag { font-family:var(--apple); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--s-muted); }
@keyframes blink { 50% { opacity:0; } }

/* Device tabs that switch by themselves, with a progress line */
.tabs { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
.tab { position:relative; overflow:hidden; font:inherit; font-size:.97rem; padding:8px 18px; border-radius:999px; border:1px solid var(--s-line); background:transparent; color:var(--s-muted); cursor:pointer; }
.tab[aria-selected="true"] { color:var(--s-fg); border-color:var(--s-fg); }
.tab .bar { position:absolute; left:0; bottom:0; height:2px; width:0; background:var(--s-gold); }
.tab[aria-selected="true"] .bar.run { animation:fill 6s linear forwards; }
@keyframes fill { to { width:100%; } }
.site .tabtext { text-align:center; color:var(--s-muted); max-width:52ch; margin:0 auto 26px; min-height:3.2em; }
.tabstage { position:relative; display:flex; justify-content:center; align-items:flex-end; min-height:200px; }
.tabstage .dev { animation:rise .6s cubic-bezier(.2,.7,.2,1) both; }
.tabstage { gap:3%; align-items:flex-end; } .tabstage .dev.imac { width:min(560px, 56%); } .tabstage .dev.mac { width:min(460px, 41%); } .tabstage .dev.ipad { width:min(300px, 31%); } .tabstage .dev.ipadl { width:min(520px, 54%); } .tabstage .dev.iphone { width:min(200px, 22%); } .tabstage .dev.duo { width:min(320px, 36%); }
@keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }

.trio { display:grid; grid-template-columns:48fr 35fr 10.2fr; grid-template-rows:auto auto; column-gap:3.4%; max-width:1100px; margin:0 auto; }
.trio figure { margin:0; display:grid; grid-row:span 2; grid-template-rows:subgrid; justify-items:center; row-gap:20px; }
.trio .dev { width:100%; align-self:end; } .trio .tphone .dev { width:62%; }
.trio figcaption { text-align:center; display:flex; flex-direction:column; gap:2px; align-self:start; white-space:nowrap; }
.trio figcaption b { font-family:var(--s-hfont); font-size:1.5rem; font-weight:600; color:var(--s-fg); }
.trio figcaption span { color:var(--s-muted); }
.show-cap { text-align:center; font-family:var(--s-hfont); font-size:2rem; line-height:1.25; color:var(--s-head); max-width:28ch; margin:0 auto 34px !important; text-wrap:balance; }
.showrow { overflow:hidden; padding:20px 0 28px; }
.showtrack { display:flex; align-items:flex-end; width:max-content; animation:drift 140s linear infinite; will-change:transform; }
.showrow:hover .showtrack { animation-play-state:paused; }
@keyframes drift { to { transform:translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .showrow { overflow-x:auto; } .showtrack { animation:none; } }
.showrow::-webkit-scrollbar { display:none; }
.sitem { flex:none; height:360px; display:flex; align-items:flex-end; margin-right:56px; }
.sitem .dev { height:100%; width:auto; } .sitem .dev .frame { height:100%; width:auto; }
.sitem.s-iphone { height:300px; } .sitem.s-mini { height:250px; } .sitem.s-ipadl { height:300px; } .sitem.s-ipad { height:360px; } .sitem.s-minip { height:310px; }
.showrow:focus-visible { outline:2px solid var(--s-gold); outline-offset:-2px; }
/* Feature cards that slide sideways (Paste style) */
.carousel { position:relative; }
.cards { display:flex; gap:22px; transition:transform .8s cubic-bezier(.2,.7,.2,1); will-change:transform; }
.card { flex:0 0 min(560px, 82%); background:var(--s-panel); border-radius:22px; padding:28px; display:flex; flex-direction:column; gap:16px; }
.card:nth-child(even) { background:var(--s-panel2); }
.card h3 { font-size:1.6rem; line-height:1.15; }
.card p { color:var(--s-muted); }
.card .shot { border-radius:12px; overflow:hidden; background:#fff; height:300px; box-shadow:0 14px 30px -16px rgba(0,0,0,.3); position:relative; }
.card .shot img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; padding:10px; box-sizing:border-box; }
.cdev { display:flex; justify-content:center; align-items:center; height:300px; padding:14px 0; box-sizing:border-box; border-radius:14px; background:radial-gradient(closest-side, color-mix(in srgb, var(--s-bg) 70%, transparent), transparent); }
.cdev .dev { height:100%; width:auto; flex:none; } .cdev .dev .frame { height:100%; width:auto; }
.plus { align-self:flex-start; font-family:var(--apple); font-size:.74rem; font-weight:600; letter-spacing:.05em; color:var(--s-gold); border:1px solid var(--s-gold); border-radius:999px; padding:2px 10px; }
.cnav { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:24px; }
.cnav button.arrow { font:inherit; width:40px; height:40px; border-radius:50%; border:1px solid var(--s-line); background:var(--s-bg); color:var(--s-fg); cursor:pointer; font-size:1.1rem; }
.dots { display:flex; gap:8px; } .dots button { width:8px; height:8px; border-radius:99px; border:0; padding:0; background:var(--s-line); cursor:pointer; transition:width .3s ease, background .3s ease; }
.dots button[aria-current="true"] { width:26px; background:var(--s-gold); }

/* Learning: the star chart stays pinned while three lines change as you scroll */
.learnmock { background:var(--s-card); border:1px solid var(--s-line); border-radius:22px; padding:26px; box-shadow:0 24px 60px -30px rgba(0,0,0,.35); }
.learnmock .lh { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.learnmock .lh b { font-family:Georgia, serif; font-size:1.6rem; font-weight:400; color:var(--s-fg); }
.learnmock .lh span { font-family:Georgia, serif; font-size:.9rem; color:var(--s-muted); font-style:italic; }
.lgrid { display:grid; grid-template-columns:minmax(0, 1.55fr) minmax(0, 1fr); gap:24px; align-items:start; font-family:Georgia, serif; }
.lgrid canvas { width:100%; aspect-ratio:1.45; display:block; color:var(--s-fg); cursor:pointer; }
.lhint { text-align:center; color:var(--s-muted); font-size:.85rem; margin-top:8px; }
.times { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-top:10px; }
.times button { font-family:Georgia, serif; font-size:.8rem; padding:3px 11px; border-radius:999px; border:1px solid color-mix(in srgb, var(--s-fg) 30%, transparent); background:transparent; color:var(--s-muted); cursor:pointer; }
.times button[aria-pressed="true"] { color:var(--s-fg); border-color:var(--s-fg); }
.lside { display:flex; flex-direction:column; gap:12px; color:var(--s-fg); }
.lpanel { border:1px solid color-mix(in srgb, var(--s-fg) 35%, transparent); border-radius:14px; padding:14px 16px; animation:panelIn .35s ease both; }
@keyframes panelIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.lpanel .ph { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.lpanel .ph b { font-size:1.2rem; font-weight:400; }
.lpanel .ph button { font:inherit; font-size:.9rem; background:none; border:0; color:var(--s-muted); cursor:pointer; }
.lpanel .sub { color:var(--s-muted); font-size:.92rem; margin:2px 0 8px; }
