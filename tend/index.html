<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Arbor</title>
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#fbfaf7;--fg:#1d1c1a;--muted:#6b6762;--line:#e2ded7;--card:#fff;--accent:#2f6f5e}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#ebe8e2;--muted:#a39e96;--line:#33323a;--card:#1f1f25;--accent:#7fc4ad}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Georgia,"Times New Roman",serif;padding:24px 16px 60px}
main{max-width:1180px;margin:0 auto} h1{font-size:1.5rem;margin:0 0 4px} .lead{color:var(--muted);margin:0 0 18px}
.strip{display:flex;flex-wrap:wrap;gap:8px 26px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.strip b{font-size:1.15rem} .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem} th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600} tr:last-child td{border-bottom:none} .muted{color:var(--muted)} .group th{font-weight:400;color:var(--muted);font-size:.8rem;padding-bottom:0;border-bottom:none}
.foot{color:var(--muted);font-size:.9rem;max-width:80ch;margin-top:14px}
form{max-width:340px;margin:12vh auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:22px}
input{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin:8px 0 12px}
button{font:600 1rem Georgia,serif;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;width:100%;cursor:pointer}
.bad{color:#b4462e;margin:0 0 8px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.fresh{color:var(--muted);font-size:.95rem;display:flex;gap:10px;align-items:center}
.btn{font:400 .88rem Georgia,serif;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;width:auto}
.btn:hover{border-color:var(--accent)} .btn.on{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:22px;margin:12px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:400 .95rem Georgia,serif;background:none;color:var(--muted);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 0;margin-bottom:-1px;cursor:pointer;width:auto;white-space:nowrap}
.tab:hover{color:var(--fg)} .tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.link{font:400 .9rem Georgia,serif;background:none;color:var(--accent);border:0;padding:0;cursor:pointer;width:auto} .link:hover{text-decoration:underline} .link.danger{color:#b4462e;text-align:left;padding:4px 2px}
.sumline{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.9rem;margin:0 0 10px}
table.wl td{vertical-align:top} table.wl td,table.wl th{padding:8px 10px} table.wl .c{text-align:center;width:1%} table.wl a{color:inherit;text-decoration:none} table.wl a:hover{color:var(--accent)}
table.wl .note{color:var(--muted);font-style:italic;font-size:.88rem;white-space:normal;margin-top:2px} .tick{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.more{font:600 1rem Georgia,serif;background:none;color:var(--muted);border:0;border-radius:6px;padding:0 6px;cursor:pointer;width:auto} .more:hover{color:var(--fg);background:var(--line)}
.sel{font:400 .9rem Georgia,serif;width:auto;margin:0 0 0 4px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg)}
.wl .txt{white-space:pre-wrap;min-width:260px;max-width:560px} .thumb{max-width:120px;max-height:90px;border-radius:6px;border:1px solid var(--line);display:block}
.tag{font-size:.78rem;border:1px solid #b4462e;color:#b4462e;border-radius:5px;padding:0 5px} table.ppl tbody tr:hover{background:var(--bg)}
@media (max-width:640px){table.ppl thead{display:none} table.ppl,table.ppl tbody{display:block} table.ppl tr{display:block;padding:10px 12px;border-bottom:1px solid var(--line)} table.ppl td{display:inline;padding:0;border:0;white-space:normal;font-size:.88rem} table.ppl td::before{content:attr(data-l) ": ";color:var(--muted)} table.ppl td:not(:first-child):not(:nth-child(5))::after{content:" · ";color:var(--muted)} table.ppl td:nth-child(n+6){display:none} table.ppl td:first-child{display:block;font-size:.95rem;margin-bottom:2px} table.ppl td:first-child::before{content:none} .wl .txt{min-width:0}}
.phone{display:none} @media (max-width:640px){table.wl thead,table.wl .j{display:none} table.wl,table.wl tbody{display:block} table.wl tr{display:grid;grid-template-columns:1fr auto auto;gap:2px 12px;padding:10px 12px;border-bottom:1px solid var(--line)} table.wl tr:last-child{border-bottom:0} table.wl td{display:block;padding:0;border:0;white-space:normal;width:auto} table.wl .n{grid-column:1;grid-row:1} table.wl .t{grid-column:2;grid-row:1} table.wl .m{grid-column:3;grid-row:1} table.wl .e,table.wl .d{grid-column:1/-1;color:var(--muted);font-size:.88rem} .phone{display:inline}} .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{width:220px;margin:0;padding:5px 10px;font-size:.9rem} .chips{display:flex;gap:6px;flex-wrap:wrap}
.menu{position:absolute;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);min-width:240px}
.menu .row{display:flex;align-items:center;gap:8px;padding:4px 0} .menu .row span{flex:1}
.menu .mv{border:1px solid var(--line);background:none;color:var(--fg);border-radius:6px;width:28px;height:26px;cursor:pointer;padding:0}
th.sort{cursor:pointer} th.sort:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px} .card h3{margin:0 0 2px;font-size:1.05rem} .card .sub{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.85rem;padding:4px 8px;border-radius:6px;display:none;z-index:9}
svg text{fill:var(--muted);font:12px Georgia,serif} .empty{color:var(--muted);font-size:.92rem;padding:30px 0;text-align:center}</style>
</head>
<body><main>
<p style="margin:0 0 6px"><a href="../" style="color:inherit;opacity:.7;text-decoration:none;font-size:.95rem">&larr; Back to the website</a><span style="opacity:.4"> &middot; </span><a href="../plan/" style="color:inherit;opacity:.7;text-decoration:none;font-size:.95rem">Plan &rarr;</a></p>
<div id="gate">
  <div style="max-width:340px;margin:12vh auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:22px">
    <h1>Arbor</h1>
    <p class="lead">For Arbor's owner.</p>
    <p class="bad" id="gate-msg"></p>
    <form id="gate-form" method="post" action="./" style="border:0;background:none;padding:0;margin:0;box-shadow:none">
    <input type="text" name="username" autocomplete="username" value="Arbor owner" readonly hidden>
    <label for="gate-code">Passcode</label>
    <input id="gate-code" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="gate-go">Open</button>
    </form>
  </div>
</div>
<div id="app" hidden><p class="lead">Loading…</p></div>
</main>
<script>
var API = "https://api.arborcurator.com", PASS = "";
(function () {
  function start() {
    var gate = document.getElementById("gate"); if (gate) gate.remove(); document.getElementById("app").hidden = false;
    var s = document.createElement("script"); s.src = "app.js"; document.body.appendChild(s);
  }
  try { var kept = JSON.parse(sessionStorage.getItem("tend-pass") || "null"); if (kept && kept.expires > Date.now() / 1000 + 60) { PASS = kept.token; start(); return; } } catch (e) {}
  var code = document.getElementById("gate-code"), msg = document.getElementById("gate-msg"), go = document.getElementById("gate-go");
  function open(e) {
    if (e) e.preventDefault();
    msg.textContent = ""; go.disabled = true;
    fetch(API + "/v1/owner-pass", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ passcode: code.value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        go.disabled = false;
        if (!res.ok) { msg.textContent = res.status === 429 ? "Too many tries. Wait an hour and try again." : "That passcode isn't right."; return; }
        PASS = res.j.token; try { sessionStorage.setItem("tend-pass", JSON.stringify(res.j)); } catch (e) {}
        start();
      })
      .catch(function () { go.disabled = false; msg.textContent = "Couldn't reach Arbor's cloud. Try again."; });
  }
  // A real form with a name and a password, removed once it works: Safari and Passwords then offer to save it.
  document.getElementById("gate-form").addEventListener("submit", open);
  code.focus();
})();
</script>
</body>
</html>
