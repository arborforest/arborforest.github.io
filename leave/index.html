<h1>Leave the waitlist</h1>
<p class="lead">Type the email you signed up with and press the button. You’ll be off the list right away, and we’ll send one last email to say so.</p>
<form class="leave" id="leave" novalidate><label for="leave-email">Email</label><input id="leave-email" type="email" autocomplete="email" required><p class="err" id="leave-err" role="alert"></p><button type="submit">Take me off the list</button></form>
<script>
(function () {
  var f = document.getElementById("leave"), err = document.getElementById("leave-err");
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("leave-email").value.trim(), btn = f.querySelector("button");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "Please check your email address."; return; }
    err.textContent = ""; btn.disabled = true;
    fetch("https://arbor-cloud.arborcurator.workers.dev/v1/waitlist/leave-by-email", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: email }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { btn.disabled = false; err.textContent = res.j.error === "too_many" ? "Too many tries from here. Please try again in an hour." : "Something didn’t work. Please try again."; return; }
        f.outerHTML = "<div class=\"leave\"><p><b>You’re off the list.</b> We won’t write to you again. Changed your mind? You can join again on the <a href=\"../\">home page</a>.</p></div>";
      })
      .catch(function () { btn.disabled = false; err.textContent = "Couldn’t reach Arbor just now. Please try again."; });
  });
})();
</script>
