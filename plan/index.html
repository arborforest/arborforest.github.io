<style>/* Layout: one part of the planning book per page. Reading column, "On this page:" list on the right (a row of buttons on phones). Colors from the Arbor logo. */
:root {
  --bg: #f5f6f2;
  --surface: #ffffff;
  --fg: #1e2a22;
  --muted: #5d6c61;
  --line: #dde2d9;
  --accent: #31573d;
  --gold: #a8701f;
  --gold-soft: #f6ecd9;
  --green-soft: #e7efe6;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a16; --surface: #1b231e; --fg: #e4ebe4; --muted: #9aab9e; --line: #2d3830;
    --accent: #8cc39a; --gold: #e2b062; --gold-soft: #2e2618; --green-soft: #1f2d23; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a16; --surface: #1b231e; --fg: #e4ebe4; --muted: #9aab9e; --line: #2d3830;
  --accent: #8cc39a; --gold: #e2b062; --gold-soft: #2e2618; --green-soft: #1f2d23; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top { max-width: 1280px; margin: 0 auto; padding-block: 36px 4px; }
header.top h1 { font-family: var(--font-display); font-weight: 600; font-size: 2.1rem; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
header.top .blurb { margin: 8px 0 0; color: var(--muted); max-width: 68ch; }
.crumbs { margin: 0; font-size: .95rem; color: var(--muted); }
.crumbs a { color: var(--accent); text-underline-offset: 2px; }

/* On this page (owner's table-of-contents rule) */
.layout { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0,1fr) 250px; gap: 48px; align-items: start; padding-block: 8px 80px; }
.content { min-width: 0; max-width: 760px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); margin-top: 40px; display: flex; flex-direction: column; padding-bottom: 8px; max-height: calc(100vh - 48px); overflow-y: auto; }
.toc-title { padding: 8px 0 8px 22px; border-left: 2px solid var(--muted); color: var(--fg); font-weight: 600; }
.toc a { padding: 6px 0 6px 36px; border-left: 2px solid var(--line); color: var(--muted); text-decoration: none; font-size: .96rem; line-height: 1.35; }
.toc a.sub { padding: 3px 0 3px 52px; font-size: .88rem; }
.toc a.parent-on { color: var(--fg); }
.toc a:hover { color: var(--fg); }
.toc a[aria-current="true"] { border-left-color: var(--accent); color: var(--fg); font-weight: 600; }
.toc a:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
section[id], h2[id], h3[id] { scroll-margin-top: 24px; }
@media (max-width: 900px) {
  .layout { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
  .toc { order: -1; flex-direction: row; overflow-x: auto; max-height: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 16px; padding: 8px 16px; gap: 6px; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .toc-title, .toc a.sub { display: none; }
  .toc a { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .toc a[aria-current="true"], .toc a.parent-on { border-color: var(--accent); color: var(--accent); }
  section[id], h2[id], h3[id] { scroll-margin-top: 70px; }
  header.top h1 { font-size: 1.7rem; }
}

/* Content typography (same as the old book) */
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; line-height: 1.25; margin: 2.4em 0 .5em; text-wrap: balance; }
.panel > h2:first-child, .panel > p:first-child + h2 { margin-top: .6em; }
.panel h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.22rem; margin: 1.8em 0 .4em; text-wrap: balance; }
.panel h4 { font-size: 1rem; margin: 1.4em 0 .3em; }
.panel p, .panel li { max-width: 68ch; }
.panel a { color: var(--accent); text-underline-offset: 2px; }
.panel ul, .panel ol { padding-left: 1.3em; }
.panel li { margin: .25em 0; }
.panel code { font-size: .88em; background: var(--green-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.panel blockquote { margin: 1em 0; padding: .2em 0 .2em 18px; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; }
.lede { font-size: 1.15rem; color: var(--muted); }
aside.note, aside.pick { margin: 1.3em 0; padding: 14px 18px; border-radius: 10px; max-width: 68ch; }
aside.note { background: var(--gold-soft); }
aside.pick { background: var(--green-soft); }
aside.pick::before { content: "Recommended"; display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
aside > :first-child { margin-top: 0; } aside > :last-child { margin-bottom: 0; }
.tag { display: inline-block; font-size: .76rem; font-weight: 600; letter-spacing: .03em; padding: 1px 8px; border-radius: 999px; background: var(--green-soft); color: var(--accent); vertical-align: 2px; white-space: nowrap; }
.tag-wait { background: var(--gold-soft); color: var(--gold); }
.tablewrap { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.panel table { border-collapse: collapse; width: 100%; font-size: .94rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
.panel th, .panel td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel th { font-weight: 600; color: var(--muted); font-size: .82rem; letter-spacing: .03em; background: var(--bg); }
.panel tr:last-child td { border-bottom: 0; }
.panel svg { max-width: 100%; height: auto; color: var(--fg); }
.panel figure { margin: 1.4em 0; overflow-x: auto; }
.owner-mark { display: inline; background: var(--gold-soft); color: var(--fg); border-left: 3px solid var(--gold); padding: 1px 6px; border-radius: 3px; font-size: .95em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.owner-mark::before { content: "Owner decision "; font-weight: 600; color: var(--gold); }

/* Previous / next part */
.prevnext { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 64px; border-top: 1px solid var(--line); padding-top: 20px; }
.prevnext a.pn { display: flex; flex-direction: column; text-decoration: none; color: var(--fg); font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; }
.prevnext a.pn + a.pn, .prevnext span + a.pn { text-align: right; }
.prevnext a.pn span { font-family: var(--font-body); font-weight: 400; font-size: .85rem; color: var(--muted); }
.prevnext a.pn:hover { color: var(--accent); }

/* Library page */
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.searchrow { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
#find { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.find-count { color: var(--muted); font-size: .9rem; white-space: nowrap; }
.find-results { list-style: none; padding: 6px; margin: 8px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 60vh; overflow-y: auto; }
.find-results li { margin: 0; max-width: none; }
.find-results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); }
.find-results a:hover, .find-results a:focus-visible { background: var(--green-soft); }
.find-results .where { display: block; font-size: .8rem; color: var(--muted); }
.find-results .empty { padding: 8px 10px; color: var(--muted); }
ul.parts { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
ul.parts li { margin: 0; max-width: none; }
a.part { display: grid; gap: 2px; padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
a.part:hover .part-name { color: var(--accent); }
.part-name { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--fg); }
.part-blurb { color: var(--muted); font-size: .97rem; max-width: 68ch; }
/* v2 (17 Nov 2026): each section is a short list of points she ticks off; research is folded underneath. */
.progress { margin: 18px 0 4px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-width: 72ch; }
.pg-top { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.pg-pct { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; color: var(--accent); line-height: 1; }
.pg-bar { height: 8px; background: var(--line); border-radius: 999px; margin: 10px 0 6px; overflow: hidden; }
.pg-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.pg-status { color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { .pg-fill { transition: none; } }
.sec { margin: 0 0 18px; padding: 6px 22px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.panel .sec > h2 { margin: .7em 0 .2em; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-count { font-family: var(--font-body); font-size: .9rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
.sec-count.all { color: var(--accent); font-weight: 600; }
.sec-intro { color: var(--muted); margin: 0 0 .6em; }
.panel ul.checks { list-style: none; padding: 0; margin: .4em 0 .6em; }
.panel ul.checks > li { display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 10px 0; border-top: 1px solid var(--line); max-width: none; }
.panel ul.checks > li:first-child { border-top: 0; }
.ck { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: var(--bg); }
.ck svg { width: 14px; height: 14px; opacity: 0; }
.ck[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.ck[aria-checked="true"] svg { opacity: 1; }
.ck:disabled { cursor: default; }
.ck:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.ck-body { min-width: 0; }
.ck-body strong { font-weight: 600; }
.ck-when { display: inline-block; margin-left: 6px; font-size: .78rem; color: var(--accent); font-weight: 600; white-space: nowrap; }
li.is-checked .ck-body { color: var(--fg); }
details.ref { margin: .4em 0 .2em; border-top: 1px dashed var(--line); padding-top: 6px; }
details.ref > summary { cursor: pointer; color: var(--muted); font-size: .92rem; padding: 4px 0; }
details.ref > summary:hover { color: var(--fg); }
details.ref[open] > summary { margin-bottom: .4em; }
details.ref .refbody { font-size: .96rem; }
.panel details.ref h2 { font-size: 1.3rem; margin: 1.2em 0 .4em; }
.panel details.ref h3 { font-size: 1.08rem; }
.toc a .tc { float: right; margin-left: 8px; font-size: .78rem; color: var(--muted); font-weight: 500; }
.toc a .tc.all { color: var(--accent); }
@media (max-width: 900px) { .toc a .tc { display: none; } .sec { padding: 4px 14px 10px; } }

/* Later and Maybe tags (owner 17 Nov 2026): small, on just the one point or heading; only placed tags show. */
:root { --note-bg: #fbe8a6; --note-fg: #5b4500; --note-edge: #e4c55c; --maybe-bg: #dfe6fb; --maybe-fg: #26386e; --maybe-edge: #a9b8e8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --note-bg: #4d3f12; --note-fg: #f6e3a0; --note-edge: #7a6420; --maybe-bg: #222e52; --maybe-fg: #c9d5fb; --maybe-edge: #3d4f86; } }
:root[data-theme="dark"] { --note-bg: #4d3f12; --note-fg: #f6e3a0; --note-edge: #7a6420; --maybe-bg: #222e52; --maybe-fg: #c9d5fb; --maybe-edge: #3d4f86; }
.tags { flex: none; margin-left: auto; align-self: flex-start; margin-top: 2px; display: inline-flex; gap: 6px; }
.tag { font-family: var(--font-body); font-size: .72rem; font-weight: 600; letter-spacing: .02em; line-height: 1.5; border-radius: 3px; padding: 0 6px; cursor: pointer; white-space: nowrap; transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.tag:not([aria-pressed="true"]) { display: none; }
.tag-later { color: var(--note-fg); background: var(--note-bg); border: 1px solid var(--note-edge); }
.tag-maybe { color: var(--maybe-fg); background: var(--maybe-bg); border: 1px solid var(--maybe-edge); transform: rotate(2deg); }
.tag:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sec-side { display: inline-flex; align-items: baseline; gap: 10px; margin-left: auto; }
.sec-side .tags { align-self: center; margin: 0; }
.toc a.is-later::after, .toc a.is-maybe::before { font-size: .66rem; font-weight: 600; border-radius: 3px; padding: 0 4px; vertical-align: 1px; }
.toc a.is-later::after { content: "Later"; margin-left: 6px; color: var(--note-fg); background: var(--note-bg); border: 1px solid var(--note-edge); }
.toc a.is-maybe::before { content: "Maybe"; margin-right: 6px; color: var(--maybe-fg); background: var(--maybe-bg); border: 1px solid var(--maybe-edge); }
.stamp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.stamp-btn { font-family: var(--font-body); font-size: .8rem; font-weight: 600; border-radius: 4px; padding: 2px 10px; cursor: pointer; }
.stamp-later { color: var(--note-fg); background: var(--note-bg); border: 1px solid var(--note-edge); }
.stamp-maybe { color: var(--maybe-fg); background: var(--maybe-bg); border: 1px solid var(--maybe-edge); }
.stamp-btn[aria-pressed="true"] { background: var(--surface); color: var(--fg); border-color: var(--muted); }
.stamp-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stamp-hint { font-size: .82rem; color: var(--muted); }
body.stamping ul.checks > li[data-id], body.stamping section.sec > h2 { cursor: copy; }
body.stamping ul.checks > li[data-id]:hover, body.stamping section.sec > h2:hover { background: var(--green-soft); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { .tag { transform: none; } }
.pg-status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.moved { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--note-bg); color: var(--note-fg); border: 1px solid var(--note-edge); max-width: 68ch; }
.moved a { color: inherit; font-weight: 600; }
/* Overhead view (owner 18 Nov 2026) */
.ov-open { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.ov-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.ov { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 92%, transparent); overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
body.ov-on { overflow: hidden; }
.ov-box { max-width: 1180px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.12); }
.ov-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ov-title { font-family: var(--font-display); font-size: 1.5rem; margin: 0; }
.ov-all { color: var(--muted); font-variant-numeric: tabular-nums; }
.ov-close { margin-left: auto; font: 600 .9rem var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
.ov-group { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.ov-gname { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0 0 6px 4px; }
.ov-tile { display: grid; grid-template-columns: 1.6em minmax(0,1fr) auto; gap: 8px; align-items: start; padding: 7px 6px; border-radius: 8px; color: var(--fg); text-decoration: none; }
.ov-tile:hover { background: var(--green-soft); }
.ov-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ov-tile.here { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.ov-num { color: var(--muted); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; padding-top: 2px; }
.ov-mid { min-width: 0; }
.ov-name { display: block; font-size: .95rem; line-height: 1.3; }
.ov-here { display: block; font-size: .75rem; font-weight: 600; color: var(--accent); }
.ov-bar { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 5px; }
.ov-bar i { display: block; height: 100%; background: var(--accent); }
.ov-pct { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ov-foot { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-top: 12px; font-size: .85rem; color: var(--muted); }
.ov-front { color: var(--accent); font-weight: 600; }
/* arborcurator.com/plan only (owner 18 Nov 2026) */
body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#gate { min-height: 80vh; display: grid; place-items: center; }
.gate-box { width: min(340px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.gate-box h1 { font-family: var(--font-display); margin: 0; }
.gate-lead { color: var(--muted); margin: 2px 0 10px; }
.gate-bad { color: #b3261e; min-height: 1.2em; margin: 0 0 6px; }
#gate-form { display: grid; gap: 8px; }
#gate-code { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--fg); }
#gate-go { font: 600 1rem var(--font-body); color: var(--surface); background: var(--accent); border: 0; border-radius: 9px; padding: 9px; cursor: pointer; }
/* front page: each page's percentage */
.part-name { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.part-pct { font-family: var(--font-body); font-size: .9rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
a.part .pg-bar { margin: 4px 0 2px; height: 5px; max-width: 520px; }
.sec-group { margin: 26px 0 0; }
.sec-group h2 { font-family: var(--font-display); font-size: 1.45rem; margin: 0 0 6px; }
/* page bits */
.pt-note { display: block; font-size: .9rem; color: var(--muted); font-style: italic; margin-top: 2px; }
.prevnext { display: flex; justify-content: space-between; gap: 12px; margin: 24px 0 8px; flex-wrap: wrap; }
.prevnext a { color: var(--accent); font-weight: 600; text-decoration: none; }
.page-intro { color: var(--muted); }
/* editing */
.stamp-edit { color: var(--fg); background: var(--surface); border: 1px solid var(--line); }
.stamp-btn:disabled { opacity: .45; cursor: default; }
.editing [data-edit] { cursor: text; border-radius: 4px; }
.editing [data-edit]:hover { background: var(--green-soft); outline: 1px dashed var(--accent); outline-offset: 2px; }
.add-intro { font-style: italic; opacity: .7; }
.add-btn { font: 600 .85rem var(--font-body); color: var(--accent); background: transparent; border: 1px dashed var(--accent); border-radius: 8px; padding: 4px 12px; margin: 4px 0 10px; cursor: pointer; }
.add-sec { margin: 4px 0 18px; }
.editor { display: block; width: 100%; margin: 4px 0; }
.editor-text { width: 100%; box-sizing: border-box; font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--accent); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.editor-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.editor-row button { font: 600 .82rem var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.editor-row button.primary { color: var(--surface); background: var(--accent); border-color: var(--accent); }
.editor-row button.danger { color: #b3261e; border-color: #e3b5b1; }
.editor-hint { font-size: .8rem; color: var(--muted); }
.stamping ul.checks > li[data-id], .stamping section.sec > h2 { cursor: copy; }
.stamping ul.checks > li[data-id]:hover, .stamping section.sec > h2:hover { background: var(--green-soft); border-radius: 6px; }
@media (max-width: 600px) { .pg-status { white-space: normal; } }
.backrow { margin: 0 0 10px; font-size: .95rem; }
.backrow a { color: var(--muted); text-decoration: none; }
.backrow a:hover { color: var(--fg); text-decoration: underline; }
.backrow span { color: var(--line); }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <h1>Arbor</h1>
    <p class="gate-lead">Your plan.</p>
    <p class="gate-bad" id="gate-msg"></p>
    <form id="gate-form" method="post" action="./">
    <input type="text" name="username" autocomplete="username" value="Arbor owner" readonly hidden>
    <label for="gate-code">Passcode</label>
    <input id="gate-code" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="gate-go">Open</button>
    </form>
  </div>
</div>
<div id="app" hidden><p class="lede">Loading…</p></div>
<script>
var API = "https://api.arborcurator.com", PASS = "";
(function () {
  function start() {
    var gate = document.getElementById("gate"); if (gate) gate.remove(); document.getElementById("app").hidden = false;
    var s = document.createElement("script"); s.src = "app.js?v=05eee57a07"; document.body.appendChild(s);
  }
  try { var kept = JSON.parse(sessionStorage.getItem("tend-pass") || "null"); if (kept && kept.expires > Date.now() / 1000 + 60) { PASS = kept.token; start(); return; } } catch (e) {}
  var code = document.getElementById("gate-code"), msg = document.getElementById("gate-msg"), go = document.getElementById("gate-go");
  function open(e) {
    if (e) e.preventDefault();
    msg.textContent = ""; go.disabled = true;
    fetch(API + "/v1/owner-pass", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ passcode: code.value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        go.disabled = false;
        if (!res.ok) { msg.textContent = res.status === 429 ? "Too many tries. Wait an hour and try again." : "That passcode isn't right."; return; }
        PASS = res.j.token; try { sessionStorage.setItem("tend-pass", JSON.stringify(res.j)); } catch (e) {}
        start();
      })
      .catch(function () { go.disabled = false; msg.textContent = "Couldn't reach Arbor's cloud. Try again."; });
  }
  document.getElementById("gate-form").addEventListener("submit", open);
  code.focus();
})();
</script>
</body>
</html>
